name: Build Android APK

# Builds the debug APK on GitHub's own runners instead of locally — the
# Android Gradle Plugin resolves its dependencies from Google's Maven repo
# (dl.google.com), which is unreachable from the sandbox this project is
# normally developed in.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/zen-dijkstra-dlmiqh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm ci

      - name: Build web assets
        run: node esbuild.config.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rent-billing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
